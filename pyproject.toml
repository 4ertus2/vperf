[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vperf"
version = "0.1.0"
description = "VTune-style CPU profiling on top of Linux perf"
requires-python = ">=3.10"

[project.scripts]
vperf = "vperf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# fixtures replicate real `perf script` output byte-for-byte (tabs matter)
"tests/test_parsers.py" = ["E101", "W29", "E501"]
"tests/test_memory_ibs.py" = ["E501"]
